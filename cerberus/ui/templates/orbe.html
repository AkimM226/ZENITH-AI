<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or "CERBERUS — Présence Orbe" }}</title>
  <link rel="stylesheet" href="/static/orbe.css">
</head>
<body>
  <!-- Fond d'ambiance et nébuleuse -->
  <div class="ambient-bg"></div>

  <!-- Barre de contrôle supérieure discrète -->
  <header class="top-bar">
    <div class="brand-badge">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">CERBERUS // EN VEILLE</span>
    </div>

    <div class="window-actions">
      <!-- Mode Omniprésent (flottant) -->
      <button class="icon-btn" id="btnOmnipresent" title="Passer en mode discret flottant">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <rect x="13" y="13" width="7" height="7" rx="1"></rect>
        </svg>
        Omniprésent
      </button>

      <!-- Accès Mode Manuel classique (Section 6) -->
      <a href="/manual" class="icon-btn" title="Ouvrir le tableau de bord complet" style="text-decoration: none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        Mode Manuel
      </a>
    </div>
  </header>

  <!-- Scène principale centrée sur l'Orbe -->
  <main class="stage state-idle" id="stage">
    <!-- Orbe vivante -->
    <div class="orb-wrapper" id="orbWrapper" title="Cliquez pour parler à Cerberus">
      <div class="orb-ring ring-1"></div>
      <div class="orb-ring ring-2"></div>
      <div class="orb" id="orb"></div>
    </div>

    <!-- Réponse orale sous-titrée / texte dynamique -->
    <div class="speech-bubble" id="speechBubble">
      Bonjour Akim. CERBERUS est à votre écoute.
    </div>

    <!-- Carte contextuelle temporaire latérale (Section 3.2) -->
    <aside class="context-panel" id="contextPanel">
      <div class="context-header">
        <div class="context-title" id="contextTitle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          Informations
        </div>
        <button class="context-close" id="contextClose" title="Fermer la carte">&times;</button>
      </div>
      <div class="context-body" id="contextBody">
        <!-- Rempli dynamiquement en JS -->
      </div>
    </aside>
  </main>

  <!-- Barre inférieure de saisie (voix + texte) -->
  <footer class="bottom-bar">
    <button class="mic-btn" id="micBtn" title="Activer la reconnaissance vocale">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>

    <input 
      type="text" 
      class="input-field" 
      id="chatInput" 
      placeholder="Parlez à Cerberus ou tapez une instruction..." 
      autocomplete="off"
    >

    <button class="send-btn" id="sendBtn" title="Envoyer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </footer>

  <script src="/static/orbe.js"></script>
</body>
</html>
