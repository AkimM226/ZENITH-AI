[project]
name = "zenith-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AkimM226", email = "akimbamba17@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.58.0",
    "google-auth-oauthlib>=1.4.1",
    "google-genai>=2.24.0",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn>=0.53.0",
]

[project.scripts]
zenith-ai = "zenith_ai:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["cerberus/tests"]

